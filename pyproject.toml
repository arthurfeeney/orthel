[project]
name = "orthel"
version = "0.1.0"
description = "A pytorch utility library with orthogonal transform and elliptic PDE solvers"
readme = "README.md"
authors = [
    { name = "Arthur Feeney", email = "afeeney@uci.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.14.1",
]

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["python/orthel"]
cmake.build-type = "Release"

[tool.uv]
# Rebuild the C++ extension when its sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cpp/**" },
]

[dependency-groups]
dev = [
    "h5py>=3.16.0",
    "matplotlib>=3.10.9",
    "pytest>=9.1.1",
    "ruff>=0.14.0",
    "scipy>=1.15.3",
]
examples = [
    "h5py>=3.16.0",
    "matplotlib>=3.10.9",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = ["--ignore=python/tests/integration"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["F", "I", "D"]
# Constructor arguments are documented under Args: in the class docstring.
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstring rules apply to the package source only.
"python/tests/**" = ["D"]
"examples/**" = ["D"]
# Package __init__.py files are kept empty.
"**/__init__.py" = ["D104"]
