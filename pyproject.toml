[project]
name = "orthel"
version = "0.1.0"
description = "A pytorch utility library with orthogonal transform and elliptic PDE solvers"
readme = "README.md"
authors = [
    { name = "Arthur Feeney", email = "afeeney@uci.edu" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "scipy>=1.15.3",
]
examples = [
    "matplotlib>=3.10.9",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = ["--ignore=python/tests/integration"]
